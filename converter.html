<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Layout Switcher (RU → EN)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(10, 14, 23, 0.85);
      --input-border: rgba(255, 255, 255, 0.06);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrapper {
      width: 100%;
      max-width: 620px;
      perspective: 1000px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
    }

    .header {
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 9999px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .hotkey-hint {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
    }

    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 0.7rem;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    textarea::placeholder {
      color: rgba(148, 163, 184, 0.4);
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
      color: #fff;
      border: none;
      padding: 14px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px -4px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -4px var(--primary-glow);
      filter: brightness(1.1);
    }

    .action-btn:active {
      transform: translateY(1px);
      filter: brightness(0.95);
    }

    .result-section {
      margin-top: 24px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateY(10px);
    }

    .result-section.active {
      opacity: 1;
      max-height: 300px;
      transform: translateY(0);
    }

    .status-toast {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .output-box {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="card">
      <div class="header">
        <div class="badge">Converter Tool</div>
        <h1>Конвертер раскладки</h1>
        <p class="desc">Пиши русскими буквами — жми кнопку: текст превратится в английские клавиши и сразу скопируется.</p>
      </div>

      <div class="field-group">
        <div class="field-header">
          <span>РУССКИЙ ТЕКСТ</span>
          <span class="hotkey-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> для быстрой конвертации</span>
        </div>
        <textarea id="input" placeholder="Начни печатать тут (например: привет как дела)..."></textarea>
      </div>

      <button class="action-btn" id="btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        <span>Преобразовать и скопировать</span>
      </button>

      <div class="result-section" id="resultWrap">
        <div class="field-group">
          <div class="field-header">
            <span>РЕЗУЛЬТАТ (АНГЛ. РАСКЛАДКА)</span>
            <div class="status-toast">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              Скопировано в буфер!
            </div>
          </div>
          <textarea id="output" class="output-box" readonly></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    const map = {
      'й':'q', 'ц':'w', 'у':'e', 'к':'r', 'е':'t', 'н':'y', 'г':'u', 'ш':'i', 'щ':'o', 'з':'p', 'х':'[', 'ъ':']',
      'ф':'a', 'ы':'s', 'в':'d', 'а':'f', 'п':'g', 'р':'h', 'о':'j', 'л':'k', 'д':'l', 'ж':';', 'э':'\'',
      'я':'z', 'ч':'x', 'с':'c', 'м':'v', 'и':'b', 'т':'n', 'ь':'m', 'б':',', 'ю':'.', 'ё':'`',
      'Й':'Q', 'Ц':'W', 'У':'E', 'К':'R', 'Е':'T', 'Н':'Y', 'Г':'U', 'Ш':'I', 'Щ':'O', 'З':'P', 'Х':'{', 'Ъ':'}',
      'Ф':'A', 'Ы':'S', 'В':'D', 'А':'F', 'П':'G', 'Р':'H', 'О':'J', 'Л':'K', 'Д':'L', 'Ж':':', 'Э':'"',
      'Я':'Z', 'Ч':'X', 'С':'C', 'М':'V', 'И':'B', 'Т':'N', 'Ь':'M', 'Б':'<', 'Ю':'>', 'Ё':'~'
    };

    function translateText(str) {
      return str.split('').map(char => map[char] || char).join('');
    }

    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const btn = document.getElementById('btn');
    const resultWrap = document.getElementById('resultWrap');

    function execute() {
      const val = input.value;
      if (!val.trim()) return;

      const converted = translateText(val);
      output.value = converted;

      resultWrap.classList.add('active');

      // Автокопирование
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(converted);
      } else {
        output.select();
        document.execCommand('copy');
      }
    }

    btn.addEventListener('click', execute);

    input.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        execute();
      }
    });
  </script>
</body>
</html>
